name: Build RaDePi ISO

on:
  #push:
  #  branches: [ "main" ]
  workflow_dispatch: # 手動で「Run」ボタンを押しても起動できるようにする設定

jobs:
  build:
    #runs-on: ubuntu-latest
    runs-on: self-hosted
    
    steps:
      - name: Force cleanup with sudo
        run: |
          echo "Previous build cleanup starting..."
          # マウントが残っていると削除できないため、まず解除
          sudo umount -l ${{ github.workspace }}/work/chroot/dev/pts || true
          sudo umount -l ${{ github.workspace }}/work/chroot/dev || true
          sudo umount -l ${{ github.workspace }}/work/chroot/proc || true
          sudo umount -l ${{ github.workspace }}/work/chroot/sys || true
          sudo umount -l ${{ github.workspace }}/work/chroot/run || true
          # sudo権限でディレクトリの中身を物理的に消去
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run build script
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh

